<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Window | Project Carminium</title>
  <link rel="stylesheet" href="floating.css">
</head>
<body>
  <div class="floating-root mini-root">
    <div class="mini-cover" id="np-cover">
      <span class="material-symbols-rounded" id="np-cover-icon">music_note</span>
      <img id="np-cover-img" src="" alt="" data-i18n-alt="floating.albumCover" hidden>
      <div class="mini-tint" id="mini-tint"></div>
    </div>
    <div class="mini-shade"></div>

    <img class="mini-brand" src="logo-dark.svg" alt="Carminium">
    <button class="mini-close" id="btn-close" data-i18n-title="title.close" data-i18n-aria-label="title.close" title="关闭" aria-label="关闭">
      <span class="material-symbols-rounded">close</span>
    </button>

    <div class="mini-track">
      <p class="mini-title" id="np-title">未在播放</p>
      <p class="mini-artist" id="np-artist">—</p>
    </div>

    <button class="mini-play" id="btn-play-pause" data-i18n-title="np.playPause" data-i18n-aria-label="np.playPause" title="播放/暂停" aria-label="播放/暂停">
      <span class="material-symbols-rounded" id="play-icon">play_arrow</span>
    </button>

    <div class="mini-bottom">
      <button class="mini-skip" id="btn-prev" data-i18n-title="np.prev" data-i18n-aria-label="np.prev" title="上一首" aria-label="上一首">
        <span class="material-symbols-rounded">skip_previous</span>
      </button>
      <div class="mini-progress" id="np-progress-bar" role="slider" tabindex="0"
           data-i18n-aria-label="np.progress" aria-label="播放进度"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="mini-progress-track">
          <div class="mini-progress-fill" id="np-progress-fill"></div>
          <div class="mini-progress-thumb" id="np-progress-thumb"></div>
        </div>
      </div>
      <button class="mini-skip" id="btn-next" data-i18n-title="np.next" data-i18n-aria-label="np.next" title="下一首" aria-label="下一首">
        <span class="material-symbols-rounded">skip_next</span>
      </button>
      <div class="mini-time"><span id="np-time-cur">0:00</span>/<span id="np-time-dur">-0:00</span></div>
    </div>
  </div>

  <script src="marquee.js"></script>
  <script src="floating_i18n.js"></script>
  <script src="pages/floating.js"></script>
</body>
</html>
