<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carminium — 正在播放</title>
  <!--
    浮动窗口 = 「正在播放」面板的独立小窗版本。

    ▸ 设计语言：结构、类名、度量与 index.html 的 .now-playing-pane 完全一致
      （.np-pivot / .np-cover / .np-info / .np-progress-* / .np-main-controls /
        .np-secondary-controls / .np-volume / .np-queue-* / .np-lyrics-*）。
      样式在 floating.css 中，数值摘自 style.css，改一边记得同步另一边。

    ▸ 为什么不用 style.css + i18n.js + pages/utils.js + bridge.js：
      那 4 个文件合计约 600KB 源码（style.css 300KB 的 CSSOM、i18n.js 209KB
      的字典、utils.js 的全量页面工具、bridge.js 的 SMTC 心跳），对这个小窗
      几乎全是无用开销。这里改为按需子集：
        floating.css        自包含样式（约 30KB）
        floating_i18n.js    35 键 × 5 语言（由 scripts/gen_floating_i18n.js 生成）
        pages/floating.js   自包含逻辑（不依赖 App.utils，不建 SMTC 心跳）
      事件也在主进程按白名单过滤（见 electron/bridge.js 的 FLOATING_EVENTS）。
  -->
  <link rel="stylesheet" href="floating.css">
</head>
<body>
  <div class="floating-root">

    <!-- 顶栏：左侧拖拽区 + 右侧窗口按钮（M3E 图标按钮） -->
    <div class="floating-titlebar">
      <span class="floating-titlebar-label" data-i18n="common.nowPlaying">正在播放</span>
      <button class="icon-btn" id="btn-dock" data-i18n-title="floating.dock" title="还原到侧边栏">
        <span class="material-symbols-rounded">dock_to_right</span>
      </button>
      <button class="icon-btn" id="btn-minimize" data-i18n-title="title.minimize" title="最小化">
        <span class="material-symbols-rounded">horizontal_rule</span>
      </button>
      <button class="icon-btn close-btn" id="btn-close" data-i18n-title="title.close" title="关闭">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>

    <!-- 标签页（M3 choice chips） -->
    <div class="np-pivot" role="tablist">
      <button class="np-pivot-tab active" data-tab="info" role="tab" aria-selected="true" data-i18n="np.tab.info">音乐信息</button>
      <button class="np-pivot-tab" data-tab="queue" role="tab" aria-selected="false" data-i18n="np.tab.queue">接下来播放</button>
      <button class="np-pivot-tab" data-tab="lyrics" role="tab" aria-selected="false" data-i18n="np.tab.lyrics">歌词</button>
    </div>

    <!-- 折叠曲目条（非「音乐信息」标签页时显示） -->
    <div class="np-mini-info" id="np-mini-info" style="display:none;">
      <div class="np-mini-cover" id="np-mini-cover">
        <span class="material-symbols-rounded" id="np-mini-cover-icon">music_note</span>
        <img id="np-mini-cover-img" src="" alt="" style="display:none">
      </div>
      <div class="np-mini-text">
        <p class="np-mini-title" id="np-mini-title">未在播放</p>
        <p class="np-mini-artist" id="np-mini-artist">—</p>
      </div>
    </div>

    <!-- 面板 -->
    <div class="np-panels">

      <!-- 音乐信息 -->
      <div class="np-panel np-panel--info active" data-panel="info">
        <div class="np-cover-wrap">
          <div class="np-cover" id="np-cover">
            <span class="np-cover-placeholder material-symbols-rounded" id="np-cover-icon">music_note</span>
            <img id="np-cover-img" src="" alt="" data-i18n-alt="floating.albumCover" style="display:none">
          </div>
        </div>

        <div class="np-info">
          <div class="np-text">
            <p class="np-title" id="np-title">未在播放</p>
            <p class="np-artist" id="np-artist">—</p>
            <p class="np-album" id="np-album"></p>
          </div>
        </div>

        <div class="np-progress-wrap">
          <div class="np-progress-bar" id="np-progress-bar" role="slider"
               data-i18n-aria-label="np.progress" aria-label="播放进度"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="np-progress-track">
              <div class="np-progress-fill" id="np-progress-fill"></div>
              <div class="np-progress-thumb" id="np-progress-thumb"></div>
            </div>
          </div>
          <div class="np-time-row">
            <span id="np-time-cur">0:00</span>
            <span id="np-time-dur">-0:00</span>
          </div>
        </div>
      </div>

      <!-- 接下来播放（懒渲染，由 JS 填充） -->
      <div class="np-panel np-panel--queue" data-panel="queue">
        <div class="np-queue-list" id="np-queue-list"></div>
      </div>

      <!-- 歌词（懒渲染，由 JS 填充） -->
      <div class="np-panel np-panel--lyrics" data-panel="lyrics">
        <div class="np-lyrics-wrap" id="np-lyrics-wrap">
          <div class="np-lyrics" id="np-lyrics">
            <div class="np-lyrics-placeholder">
              <span class="material-symbols-rounded">lyrics</span>
              <p data-i18n="np.noLyrics">暂无歌词</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 主控制 -->
    <div class="np-main-controls">
      <button class="np-control-pill" id="btn-prev" data-i18n-aria-label="np.prev" data-i18n-title="np.prev" aria-label="上一首" title="上一首">
        <span class="material-symbols-rounded">skip_previous</span>
      </button>
      <button class="np-play-pill" id="btn-play-pause" data-i18n-aria-label="np.playPause" aria-label="播放/暂停">
        <span class="material-symbols-rounded" id="play-icon">play_arrow</span>
      </button>
      <button class="np-control-pill" id="btn-next" data-i18n-aria-label="np.next" data-i18n-title="np.next" aria-label="下一首" title="下一首">
        <span class="material-symbols-rounded">skip_next</span>
      </button>
    </div>

    <!-- 辅助控制（M3E 分段组） -->
    <div class="np-secondary-controls">
      <button class="np-secondary-btn" id="btn-shuffle" data-i18n-aria-label="np.shuffle" data-i18n-title="np.shuffle" aria-label="随机" title="随机播放">
        <span class="material-symbols-rounded">shuffle</span>
      </button>
      <button class="np-secondary-btn" id="btn-repeat" data-i18n-aria-label="np.repeat" data-i18n-title="np.repeat" aria-label="循环" title="循环播放">
        <span class="material-symbols-rounded">repeat</span>
      </button>
      <button class="np-secondary-btn" id="btn-like" data-i18n-aria-label="np.like" data-i18n-title="np.like" aria-label="收藏" title="收藏">
        <span class="material-symbols-rounded">favorite</span>
      </button>
      <button class="np-audio-mode-btn" id="btn-audio-mode" data-i18n-aria-label="np.audioMode" data-i18n-title="np.audioMode" aria-label="切换音频模式" title="音频模式">
        <span class="np-audio-mode-label" id="audio-mode-label">shrd</span>
      </button>
    </div>

    <!-- 音量 -->
    <div class="np-volume">
      <button class="icon-btn volume-icon-btn" id="btn-mute" data-i18n-aria-label="np.mute" data-i18n-title="np.mute" aria-label="静音" title="静音">
        <span class="material-symbols-rounded" id="vol-icon">volume_up</span>
      </button>
      <input type="range" class="volume-slider" id="volume-slider"
             min="0" max="100" value="80" data-i18n-aria-label="np.volume" aria-label="音量">
      <span class="vol-label" id="vol-label">80</span>
    </div>

  </div>

  <script src="floating_i18n.js"></script>
  <script src="pages/floating.js"></script>
</body>
</html>
