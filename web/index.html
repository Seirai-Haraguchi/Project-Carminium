<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carminium</title>
  <meta name="description" content="Carminium — 本地音乐播放器">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,GRAD@8..48,100..700,-200..150&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ── 自绘标题栏 ──────────────────────────────────────── -->
  <div class="title-bar" id="title-bar">
    <div class="title-bar-left">
      <button class="title-bar-btn title-bar-back" id="title-bar-back" title="返回" aria-label="返回">
        <span class="title-bar-glyph" id="title-bar-back-icon"></span>
      </button>
      <div class="title-bar-logo" id="title-bar-logo"></div>
      <div class="title-bar-title-wrap">
        <span class="title-bar-title">Project Carminium</span>
        <span class="title-bar-version" id="title-bar-version"></span>
      </div>
      <span class="title-bar-codename" id="title-bar-codename"></span>
    </div>
    <div class="title-bar-right">
      <button class="title-bar-btn title-bar-min" id="title-bar-min" title="最小化" aria-label="最小化">
        <span class="title-bar-glyph" id="title-bar-min-icon"></span>
      </button>
      <button class="title-bar-btn title-bar-max" id="title-bar-max" title="最大化/还原" aria-label="最大化或还原">
        <span class="title-bar-glyph" id="title-bar-max-icon"></span>
      </button>
      <button class="title-bar-btn title-bar-close" id="title-bar-close" title="关闭" aria-label="关闭">
        <span class="title-bar-glyph" id="title-bar-close-icon"></span>
      </button>
    </div>
  </div>

  <div class="app-shell">

    <!-- ── 左侧导航 ──────────────────────────────────────── -->
    <nav class="nav-drawer" id="nav-drawer" aria-label="主导航">

      <div class="nav-section nav-main">
        <button class="nav-item" data-page="music" id="nav-music" aria-label="音乐">
          <span class="nav-indicator">
            <span class="material-symbols-rounded">music_note</span>
          </span>
          <span class="nav-label">音乐</span>
        </button>
        <button class="nav-item" data-page="albums" id="nav-albums" aria-label="专辑">
          <span class="nav-indicator">
            <span class="material-symbols-rounded">album</span>
          </span>
          <span class="nav-label">专辑</span>
        </button>
        <button class="nav-item" data-page="artists" id="nav-artists" aria-label="艺术家">
          <span class="nav-indicator">
            <span class="material-symbols-rounded">person</span>
          </span>
          <span class="nav-label">艺术家</span>
        </button>
        <button class="nav-item" data-page="folders" id="nav-folders" aria-label="文件夹">
          <span class="nav-indicator">
            <span class="material-symbols-rounded">folder_open</span>
          </span>
          <span class="nav-label">文件夹</span>
        </button>
        <button class="nav-item nav-item-desktop-only" data-page="history" id="nav-history" aria-label="播放历史">
          <span class="nav-indicator">
            <span class="material-symbols-rounded">history</span>
          </span>
          <span class="nav-label">历史</span>
        </button>
        <button class="nav-item nav-item-desktop-only" data-page="liked" id="nav-liked" aria-label="喜爱的音乐">
          <span class="nav-indicator">
            <span class="material-symbols-rounded">favorite</span>
          </span>
          <span class="nav-label">喜爱</span>
        </button>
        <button class="nav-item nav-item-desktop-only nav-has-submenu" id="nav-playlists" aria-label="歌单" aria-haspopup="menu" aria-expanded="false">
          <span class="nav-indicator">
            <span class="material-symbols-rounded">queue_music</span>
          </span>
          <span class="nav-label">歌单</span>
        </button>
      </div>

      <div class="nav-section nav-bottom">
        <button class="nav-item" data-page="settings" id="nav-settings" aria-label="设置">
          <span class="nav-indicator">
            <span class="material-symbols-rounded">settings</span>
          </span>
          <span class="nav-label">设置</span>
        </button>
        </div>

    </nav>

    <!-- ── 中部内容区 ─────────────────────────────────────── -->
    <main class="content-pane" id="content-pane" role="main">
      <button class="mobile-settings-fab" id="mobile-settings-fab" title="设置" aria-label="设置">
        <span class="material-symbols-rounded">settings</span>
      </button>
      <div class="page-container" id="page-container">
        <!-- 启动时加载动画 -->
        <div class="splash" id="splash">
          <span class="material-symbols-rounded splash-icon">music_note</span>
          <p class="splash-text">正在连接…</p>
        </div>
      </div>
    </main>

    <!-- ── 右侧正在播放 ───────────────────────────────────── -->
    <aside class="now-playing-pane" id="now-playing-pane" aria-label="全窗口视图">

      <!-- 模糊封面背景层（流体位移 + 噪点 + Material You 遮罩） -->
      <div class="np-bg" aria-hidden="true">
        <svg class="np-bg-defs" xmlns="http://www.w3.org/2000/svg" width="0" height="0" focusable="false">
          <defs>
            <filter id="np-fluid-filter" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
              <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="1" seed="7" result="turb">
                <animate attributeName="baseFrequency"
                         values="0.006 0.009; 0.011 0.006; 0.007 0.012; 0.006 0.009"
                         dur="24s" repeatCount="indefinite"
                         calcMode="spline" keyTimes="0; 0.33; 0.66; 1"
                         keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
              </feTurbulence>
              <feDisplacementMap in="SourceGraphic" in2="turb" scale="55" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
          </defs>
        </svg>
        <div class="np-bg-covers" id="np-bg-covers">
          <div class="np-bg-cover" id="np-bg-cover-a"></div>
          <div class="np-bg-cover" id="np-bg-cover-b"></div>
        </div>
        <div class="np-bg-noise"></div>
        <div class="np-bg-mask"></div>
      </div>

      <!-- Split button（上部） -->
      <div class="np-top-bar">
        <!-- 折りたたみボタン（左側） -->
        <button class="np-collapse-btn" id="btn-collapse" title="收折播放界面">
          <span class="material-symbols-rounded">expand_more</span>
        </button>
        <div class="split-button" id="np-split-btn">
          <button class="split-btn-main" id="btn-fullscreen" title="全屏播放界面">
            <span class="material-symbols-rounded">fullscreen</span>
            <span class="split-btn-text">全窗口视图</span>
          </button>
          <button class="split-btn-dropdown" id="btn-more-dropdown" title="更多">
            <span class="material-symbols-rounded">arrow_drop_down</span>
          </button>
          <div class="split-dropdown-menu" id="split-dropdown-menu" style="display:none;">
            <div class="split-dropdown-item" id="btn-theater">
              <span class="material-symbols-rounded">crop_free</span>
              <span>全屏视图</span>
            </div>
            <div class="split-dropdown-item" id="btn-floating">
              <span class="material-symbols-rounded">picture_in_picture</span>
              <span>浮动窗口</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Pivot タブ -->
      <div class="np-pivot" role="tablist">
        <button class="np-pivot-tab active" data-tab="info" role="tab" aria-selected="true">音乐信息</button>
        <button class="np-pivot-tab" data-tab="queue" role="tab" aria-selected="false">接下来播放</button>
        <button class="np-pivot-tab" data-tab="lyrics" role="tab" aria-selected="false">歌词</button>
        <div class="np-pivot-indicator" id="np-pivot-indicator"></div>
      </div>

      <!-- ミニ曲情報バー（非音楽情報タブ時に表示） -->
      <div class="np-mini-info" id="np-mini-info" style="display:none;">
        <div class="np-mini-cover" id="np-mini-cover">
          <span class="material-symbols-rounded" id="np-mini-cover-icon">music_note</span>
          <img id="np-mini-cover-img" src="" alt="" style="display:none">
        </div>
        <div class="np-mini-text">
          <p class="np-mini-title" id="np-mini-title">未在播放</p>
          <p class="np-mini-artist" id="np-mini-artist">—</p>
        </div>
      </div>

      <!-- 统一面板容器（非全屏时三个面板都在这里；全屏时CSS Grid重排） -->
      <div class="np-panels" id="np-panels">
        <!-- 音乐信息 -->
        <div class="np-panel np-panel--info active" data-panel="info">
          <!-- 封面 -->
          <div class="np-cover-wrap">
            <div class="np-cover" id="np-cover">
              <span class="np-cover-placeholder material-symbols-rounded" id="np-cover-icon">music_note</span>
              <img id="np-cover-img" src="" alt="专辑封面" style="display:none">
            </div>
          </div>

          <!-- 曲目信息 -->
          <div class="np-info">
            <div class="np-text">
              <p class="np-title" id="np-title">未在播放</p>
              <p class="np-artist" id="np-artist">—</p>
              <p class="np-album" id="np-album"></p>
            </div>
          </div>

          <!-- 进度条 -->
          <div class="np-progress-wrap">
            <div class="np-progress-bar" id="np-progress-bar" role="slider"
                 aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="np-progress-track">
                <div class="np-progress-fill" id="np-progress-fill"></div>
                <div class="np-progress-thumb" id="np-progress-thumb"></div>
                <div class="np-transition-marker" id="np-transition-marker">过渡</div>
              </div>
            </div>
            <div class="np-time-row">
              <span id="np-time-cur">0:00</span>
              <span id="np-time-dur">0:00</span>
            </div>
          </div>
        </div>

        <!-- 接下来播放 -->
        <div class="np-panel np-panel--queue" data-panel="queue">
          <div class="np-queue-list" id="np-queue-list">
            <!-- Filled by JS -->
          </div>
        </div>

        <!-- 歌词 -->
        <div class="np-panel np-panel--lyrics" data-panel="lyrics">
          <div class="np-lyrics-wrap" id="np-lyrics-wrap">
            <div class="np-lyrics" id="np-lyrics">
              <div class="np-lyrics-placeholder">
                <span class="material-symbols-rounded">lyrics</span>
                <p>暂无歌词</p>
              </div>
            </div>
          </div>
          <!-- 歌词来源标记（左下角） -->
          <div class="np-lyrics-source" id="np-lyrics-source">
            <span class="np-lyrics-source-icon">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                <text x="12" y="17" text-anchor="middle" font-size="16" font-weight="700"
                      font-family="'Noto Sans SC','Noto Sans',sans-serif" fill="currentColor">詞</text>
              </svg>
            </span>
            <span class="np-lyrics-source-label" id="np-lyrics-source-label">Embedded</span>
          </div>
          <!-- 歌词功能区（右下角） -->
          <div class="np-lyrics-toolbar" id="np-lyrics-toolbar">
            <button class="np-lyrics-tool-btn" id="np-lyrics-search-btn" title="搜索歌词" aria-label="搜索歌词">
              <span class="material-symbols-rounded">search</span>
            </button>
            <button class="np-lyrics-tool-btn active" id="np-lyrics-trans-btn" title="显示/隐藏翻译" aria-label="翻译">
              <span class="material-symbols-rounded">translate</span>
            </button>
            <button class="np-lyrics-tool-btn active" id="np-lyrics-romaji-btn" title="显示/隐藏罗马音" aria-label="罗马音">
              <span class="material-symbols-rounded">abc</span>
            </button>
          </div>
          <!-- 歌词搜索面板 -->
          <div class="np-lyrics-search-overlay" id="np-lyrics-search-overlay" style="display:none">
            <div class="np-lyrics-search-panel">
              <div class="np-lyrics-search-header">
                <span class="material-symbols-rounded np-lyrics-search-icon">search</span>
                <input type="text" id="np-lyrics-search-input" placeholder="搜索歌曲、歌手…" autocomplete="off">
                <button class="np-lyrics-search-close" id="np-lyrics-search-close" aria-label="关闭">
                  <span class="material-symbols-rounded">close</span>
                </button>
              </div>
              <div class="np-lyrics-search-results" id="np-lyrics-search-results"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 播放控制 - 主按钮 -->
      <div class="np-main-controls">
        <button class="np-control-pill" id="btn-prev" aria-label="上一首" title="上一首">
          <span class="material-symbols-rounded">skip_previous</span>
        </button>
        <button class="np-play-pill" id="btn-play-pause" aria-label="播放/暂停">
          <span class="material-symbols-rounded" id="play-icon">play_arrow</span>
        </button>
        <button class="np-control-pill" id="btn-next" aria-label="下一首" title="下一首">
          <span class="material-symbols-rounded">skip_next</span>
        </button>
      </div>

      <!-- 播放控制 - 辅助按钮 -->
      <div class="np-secondary-controls">
        <button class="icon-btn np-secondary-btn" id="btn-shuffle" aria-label="随机" title="随机播放">
          <span class="material-symbols-rounded">shuffle</span>
        </button>
        <button class="icon-btn np-secondary-btn" id="btn-repeat" aria-label="循环" title="循环播放">
          <span class="material-symbols-rounded">repeat</span>
        </button>
        <button class="icon-btn np-secondary-btn" id="btn-like" aria-label="收藏" title="收藏">
          <span class="material-symbols-rounded">favorite</span>
        </button>
        <button class="np-audio-mode-btn" id="btn-audio-mode" aria-label="切换音频模式" title="音频模式">
          <span class="np-audio-mode-label" id="audio-mode-label">shrd</span>
        </button>
      </div>

      <!-- 音量 -->
      <div class="np-volume">
        <button class="icon-btn volume-icon-btn" id="btn-mute" aria-label="静音" title="静音">
          <span class="material-symbols-rounded" id="vol-icon">volume_up</span>
        </button>
        <input type="range" class="volume-slider" id="volume-slider"
               min="0" max="100" value="80" aria-label="音量">
        <span class="vol-label" id="vol-label">80</span>
      </div>

    </aside>

    <!-- ── 底部播放栏 (Mini Player) ─────────────────────── -->
    <div class="mini-player" id="mini-player">
      <div class="mini-player-cover">
        <span class="material-symbols-rounded mini-player-cover-icon" id="mini-cover-icon">music_note</span>
        <img id="mini-cover-img" src="" alt="" style="display:none">
      </div>
      <div class="mini-player-info">
        <div class="mini-player-title" id="mini-title">未在播放</div>
        <div class="mini-player-artist" id="mini-artist">—</div>
      </div>
      <div class="mini-player-controls">
        <button class="mini-btn" id="mini-btn-prev" title="上一首">
          <span class="material-symbols-rounded">skip_previous</span>
        </button>
        <button class="mini-btn-play" id="mini-btn-play" title="播放/暂停">
          <span class="material-symbols-rounded" id="mini-play-icon">play_arrow</span>
        </button>
        <button class="mini-btn" id="mini-btn-next" title="下一首">
          <span class="material-symbols-rounded">skip_next</span>
        </button>
        <button class="mini-btn-expand" id="mini-btn-expand" title="展开播放界面">
          <span class="material-symbols-rounded">expand_less</span>
        </button>
      </div>
    </div>

  </div><!-- .app-shell -->

  <!-- 歌单副菜单（飞出式） -->
  <div class="nav-submenu" id="nav-playlists-submenu" role="menu" aria-label="歌单列表" hidden>
    <div class="nav-submenu-header">
      <span class="nav-submenu-title">歌单</span>
      <button class="nav-submenu-add" id="nav-playlist-add" title="新建歌单" aria-label="新建歌单">
        <span class="material-symbols-rounded">add</span>
      </button>
    </div>
    <div class="nav-submenu-list" id="nav-playlists-list"></div>
  </div>

  <!-- Electron IPC bridge -->
  <script src="bridge.js"></script>

  <!-- Custom title bar logic -->
  <script src="titlebar.js"></script>

  <!-- Web Audio API player (frontend playback) -->
  <script src="audio_player.js"></script>

  <!-- Page modules (loaded before app.js) -->
  <script src="pages/utils.js"></script>
  <script src="pages/context_menu.js"></script>
  <script src="pages/now_playing.js"></script>
  <script src="pages/music.js"></script>
  <script src="pages/albums.js"></script>
  <script src="pages/artists.js"></script>
  <script src="pages/folders.js"></script>
  <script src="pages/history.js"></script>
  <script src="pages/liked.js"></script>
  <script src="pages/playlists.js"></script>
  <script src="pages/settings.js"></script>
  <script src="pages/about.js"></script>

  <!-- Main app (last) -->
  <script src="app.js"></script>
</body>
</html>
