name: Nightly Build & Prerelease

on:
  schedule:
    # 每天 UTC 16:00 运行（北京时间次日 00:00）
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # 1. 更新版本号日期并提交
  # ─────────────────────────────────────────────
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.update.outputs.version }}
      date: ${{ steps.update.outputs.date }}
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update version date
        id: update
        run: |
          output=$(node scripts/update-nightly-version.js)
          echo "$output"
          VERSION=$(echo "$output" | grep '^NIGHTLY_VERSION=' | cut -d= -f2)
          DATE=$(echo "$output" | grep '^NIGHTLY_DATE=' | cut -d= -f2)
          CHANGED=$(echo "$output" | grep '^NIGHTLY_CHANGED=' | cut -d= -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

      - name: Commit & push
        if: steps.update.outputs.changed == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json package.json
          git commit -m "chore(nightly): update version date to ${{ steps.update.outputs.version }}"
          git push

  # ─────────────────────────────────────────────
  # 2. Windows 构建
  # ─────────────────────────────────────────────
  build-windows:
    needs: update-version
    if: needs.update-version.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Update version locally
        run: node scripts/update-nightly-version.js

      - name: Build native library (Zig)
        working-directory: native
        run: zig build copy copy-legacy -Doptimize=ReleaseFast

      - name: Rebuild native addons
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build Electron app (portable)
        run: npx electron-builder --win portable

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist-electron/*.exe
          retention-days: 7

  # ─────────────────────────────────────────────
  # 3. Linux 构建
  # ─────────────────────────────────────────────
  build-linux:
    needs: update-version
    if: needs.update-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libfuse2

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Update version locally
        run: node scripts/update-nightly-version.js

      - name: Build native library (Zig)
        working-directory: native
        run: zig build copy copy-legacy -Doptimize=ReleaseFast

      - name: Rebuild native addons
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build Electron app (deb + AppImage)
        run: npx electron-builder --linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist-electron/*.deb
            dist-electron/*.AppImage
          retention-days: 7

  # ─────────────────────────────────────────────
  # 4. 创建 GitHub Prerelease
  # ─────────────────────────────────────────────
  release:
    needs: [update-version, build-windows, build-linux]
    if: needs.update-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ needs.update-version.outputs.date }}
          name: Nightly ${{ needs.update-version.outputs.version }}
          prerelease: true
          body: |
            ## Nightly Build

            **版本:** `${{ needs.update-version.outputs.version }}`
            **构建日期:** `${{ needs.update-version.outputs.date }}`

            > ⚠️ 这是自动构建的 nightly 版本，可能不稳定。

            ### 下载
            - **Windows:** `.exe` (portable) — 免安装便携版
            - **Linux:** `.deb` — Debian/Ubuntu 安装包
            - **Linux:** `.AppImage` — 免安装直接运行
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old nightly releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 删除 7 天前的 nightly releases
          CUTOFF=$(date -d "7 days ago" +%Y%m%d)
          echo "Cleaning up nightly releases older than ${CUTOFF}"
          gh release list --limit 100 | grep 'Nightly' | while IFS= read -r line; do
            TAG=$(echo "$line" | awk '{print $1}')
            TAG_DATE=$(echo "$TAG" | grep -oP '\d{8}')
            if [ -n "$TAG_DATE" ] && [ "$TAG_DATE" -lt "$CUTOFF" ]; then
              echo "Deleting old nightly release: ${TAG}"
              gh release delete "$TAG" --yes --cleanup-tag
            fi
          done
