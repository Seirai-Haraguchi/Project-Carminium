name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        type: string
      prerelease:
        description: 'Mark this release as a prerelease'
        required: true
        default: false
        type: boolean
      draft:
        description: 'Create the release as a draft'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci --include=optional --prefer-offline --no-audit --no-fund

      - name: Sync version
        run: node scripts/sync-version.js

      - name: Download ffmpeg/ffprobe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            "User-Agent" = "Carminium-release"
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Accept" = "application/vnd.github+json"
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest" -Headers $headers
          $pattern = if ('${{ matrix.arch }}' -eq 'arm64') { 'winarm64-gpl\.zip$' } else { 'win64-gpl\.zip$' }
          $asset = $release.assets | Where-Object { $_.name -match $pattern -and $_.name -notmatch "shared" } | Select-Object -First 1
          if (-not $asset) { throw "No FFmpeg asset found for ${{ matrix.arch }}" }
          Write-Host "Downloading $($asset.name) ($([math]::Round($asset.size / 1MB, 1)) MB)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-temp -Force
          $binDir = Get-ChildItem ffmpeg-temp -Directory | Select-Object -First 1
          Copy-Item "$($binDir.FullName)\bin\ffmpeg.exe" electron\bin\win32\ffmpeg.exe -Force
          Copy-Item "$($binDir.FullName)\bin\ffprobe.exe" electron\bin\win32\ffprobe.exe -Force
          Remove-Item -Recurse ffmpeg-temp, ffmpeg.zip -Force
          Write-Host "ffmpeg installed:"; electron\bin\win32\ffprobe.exe -version | Select-Object -First 1

      - name: Build native library (Zig)
        working-directory: native
        run: zig build copy copy-legacy -Doptimize=ReleaseFast

      - name: Rebuild native addons
        shell: pwsh
        run: |
          npx @electron/rebuild -f -w better-sqlite3
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to rebuild better-sqlite3"
          }

      - name: Verify pre-build artifacts and architectures (Windows)
        shell: pwsh
        run: |
          # --- existence checks ---
          if (-not (Test-Path electron\bin\win32\carminium_audio.dll) -or (Get-Item electron\bin\win32\carminium_audio.dll).Length -eq 0) {
            throw "carminium_audio.dll is missing or empty"
          }
          if (-not (Test-Path electron\bin\win32\ffmpeg.exe) -or (Get-Item electron\bin\win32\ffmpeg.exe).Length -eq 0) {
            throw "ffmpeg.exe is missing or empty"
          }

          # --- PE machine type verification ---
          function Get-PEMachine {
            param([string]$Path)
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            if ($bytes.Length -lt 64) { return "TOO SMALL" }
            $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
            switch ($machine) {
              0x8664 { return 'x64' }
              0xAA64 { return 'ARM64' }
              0x014C { return 'x86' }
              default { return "Unknown (0x$($machine.ToString('X4')))" }
            }
          }
          $expectedMachine = if ('${{ matrix.arch }}' -eq 'arm64') { 'ARM64' } else { 'x64' }

          # carminium_audio.dll
          $actual = Get-PEMachine electron\bin\win32\carminium_audio.dll
          Write-Host "carminium_audio.dll: $actual (expected: $expectedMachine)"
          if ($actual -ne $expectedMachine) { throw "carminium_audio.dll architecture mismatch: $actual != $expectedMachine" }

          # ffmpeg.exe
          $actual = Get-PEMachine electron\bin\win32\ffmpeg.exe
          Write-Host "ffmpeg.exe: $actual (expected: $expectedMachine)"
          if ($actual -ne $expectedMachine) { throw "ffmpeg.exe architecture mismatch: $actual != $expectedMachine" }

          # better-sqlite3 native addon (prebuilds or build/Release)
          $prebuildFile = "node_modules\better-sqlite3\prebuilds\win32-${{ matrix.arch }}.node"
          $buildFile = "node_modules\better-sqlite3\build\Release\better_sqlite3.node"
          $nodeFile = if (Test-Path $prebuildFile) { $prebuildFile } elseif (Test-Path $buildFile) { $buildFile } else { $null }
          if ($nodeFile) {
            $actual = Get-PEMachine $nodeFile
            Write-Host "better_sqlite3.node ($nodeFile): $actual (expected: $expectedMachine)"
            if ($actual -ne $expectedMachine) { throw "better_sqlite3.node architecture mismatch: $actual != $expectedMachine" }
          } else {
            throw "better_sqlite3.node not found at $prebuildFile or $buildFile"
          }

          # koffi optional dependency
          $koffiDir = "node_modules\@koromix\koffi-win32-${{ matrix.arch }}"
          if (-not (Test-Path $koffiDir)) { throw "koffi ${{ matrix.arch }} dependency not found: $koffiDir" }
          Write-Host "koffi ${{ matrix.arch }} dependency: OK"

          # sharp optional dependency
          $sharpDir = "node_modules\@img\sharp-win32-${{ matrix.arch }}"
          if (-not (Test-Path $sharpDir)) { throw "sharp ${{ matrix.arch }} dependency not found: $sharpDir" }
          Write-Host "sharp ${{ matrix.arch }} dependency: OK"

          Write-Host "Pre-build artifacts and architectures verified."
          Get-Item electron\bin\win32\carminium_audio.dll, electron\bin\win32\ffmpeg.exe | Format-Table Name, Length

      - name: Clean up unnecessary build artifacts
        shell: pwsh
        run: |
          if (Test-Path node_modules\koffi\build) {
            Remove-Item -Recurse -Force node_modules\koffi\build
            Write-Host "Removed koffi CMake build artifacts"
          }

      - name: Build Electron app (portable)
        shell: pwsh
        run: |
          $maxRetries = 3
          $retryCount = 0
          do {
            $retryCount++
            Write-Host "Build attempt $retryCount of $maxRetries"
            npx electron-builder --win portable --${{ matrix.arch }} --publish never
            if ($LASTEXITCODE -eq 0) { break }
            if ($retryCount -lt $maxRetries) {
              Write-Host "Build failed, retrying in 15 seconds..."
              Start-Sleep -Seconds 15
            }
          } while ($retryCount -lt $maxRetries)
          if ($LASTEXITCODE -ne 0) { throw "Build failed after $maxRetries attempts" }

      - name: Rename artifact with architecture
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $source = Get-ChildItem dist-electron\*.exe | Select-Object -First 1
          $destination = "dist-electron\Carminium-$version-windows-${{ matrix.arch }}.exe"
          Move-Item $source.FullName $destination -Force
          Write-Host "Created $destination"

      - name: Smoke test (native runner)
        shell: pwsh
        run: |
          # Start the portable exe, wait a few seconds, then kill it.
          # On a native runner (x64 on windows-latest, ARM64 on windows-11-arm),
          # a successful start means the Electron binary and all native modules
          # (koffi, better-sqlite3, sharp, carminium_audio.dll) loaded correctly.
          $exe = (Get-ChildItem dist-electron\*.exe | Select-Object -First 1).FullName
          Write-Host "Smoke testing: $exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            Write-Host "Process exited early with code $($proc.ExitCode) — build is broken!"
            throw "Smoke test failed: process exited after $([math]::Round(($proc.ExitTime - $proc.StartTime).TotalSeconds, 1))s"
          }
          Write-Host "Process is still running after 10s — smoke test passed."
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-artifacts
          path: dist-electron/*.exe
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          # GitHub-hosted Ubuntu images may contain Microsoft/Azure sources
          # that intermittently return 403 or are malformed. They are unrelated
          # to this build; disable them for this ephemeral runner before APT.
          # Handle both legacy .list and deb822 .sources formats.
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list \
                    /etc/apt/sources.list.d/azure-cli.sources \
                    /etc/apt/sources.list.d/msprod.list \
                    /etc/apt/sources.list.d/msprod.sources \
                    /etc/apt/sources.list.d/microsoft-prod.list \
                    /etc/apt/sources.list.d/microsoft-prod.sources || true
          sudo sed -i '/packages.microsoft.com/d' /etc/apt/sources.list || true
          sudo sed -i '/packages.microsoft.com/d' /etc/apt/sources.list.d/*.list 2>/dev/null || true

          sudo apt-get update
          # build-essential / g++ / make / python3: Zig & node-gyp / better-sqlite3
          # libsqlite3-dev: better-sqlite3 native binding
          # libasound2-dev / libpulse-dev / libfuse2: audio + AppImage runtime
          # libgtk-3-dev / libnotify-dev / libappindicator3-dev / libxtst-dev / libxss-dev: electron-builder linux deps
          # jq / ca-certificates / wget: ffmpeg release JSON parsing & download
          sudo apt-get install -y \
            build-essential \
            python3 \
            python3-pip \
            python3-dev \
            make \
            g++ \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libfuse2 \
            libssl-dev \
            libsqlite3-dev \
            libgtk-3-dev \
            libnotify-dev \
            libappindicator3-dev \
            libxtst-dev \
            libxss-dev \
            jq \
            ca-certificates \
            wget

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Sync version
        run: node scripts/sync-version.js

      - name: Download ffmpeg/ffprobe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Fetching BtbN/FFmpeg-Builds latest release..."
          API_URL="https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest"
          RELEASE_JSON=$(curl --fail-with-body --retry 3 --retry-delay 2 -sSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: Carminium-release" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "$API_URL")
          FFMPEG_URL=$(printf '%s' "$RELEASE_JSON" \
            | jq -r '[.assets // [] | .[] | select(.name | endswith("linux64-gpl.tar.xz"))][0].browser_download_url // empty')
          if [ -z "$FFMPEG_URL" ]; then
            echo "No linux64-gpl.tar.xz asset found in the latest BtbN release." >&2
            printf '%s' "$RELEASE_JSON" | jq -r '.message // "API response did not contain a matching asset"' >&2
            exit 1
          fi
          echo "Downloading $FFMPEG_URL..."
          curl --fail-with-body --retry 3 --retry-delay 2 -L -o ffmpeg.tar.xz "$FFMPEG_URL"
          tar -tf ffmpeg.tar.xz > ffmpeg-contents.txt
          DIR=$(sed -n '1s#/.*##p' ffmpeg-contents.txt)
          if [ -z "$DIR" ]; then
            echo "Unable to determine FFmpeg archive directory." >&2
            head -n 10 ffmpeg-contents.txt >&2
            exit 1
          fi
          tar xf ffmpeg.tar.xz
          if [ ! -d "$DIR" ] || [ ! -x "$DIR/bin/ffmpeg" ] || [ ! -x "$DIR/bin/ffprobe" ]; then
            echo "FFmpeg archive has an unexpected layout: $DIR" >&2
            find "$DIR" -maxdepth 2 -type f 2>/dev/null | head -n 20 >&2 || true
            exit 1
          fi
          install -m 755 "$DIR/bin/ffmpeg"  electron/bin/linux/ffmpeg
          install -m 755 "$DIR/bin/ffprobe" electron/bin/linux/ffprobe
          rm -rf "$DIR" ffmpeg.tar.xz ffmpeg-contents.txt
          electron/bin/linux/ffprobe -version > ffprobe-version.txt 2>&1
          echo "ffmpeg installed:"; head -n 1 ffprobe-version.txt
          rm -f ffprobe-version.txt

      - name: Build native library (Zig)
        working-directory: native
        run: zig build copy copy-legacy -Doptimize=ReleaseFast

      - name: Verify pre-build artifacts (Linux)
        shell: bash
        run: |
          set -euxo pipefail
          test -s electron/bin/linux/carminium_audio.so
          test -x electron/bin/linux/ffmpeg
          test -x electron/bin/linux/ffprobe
          file electron/bin/linux/carminium_audio.so
          ldd electron/bin/linux/carminium_audio.so
          electron/bin/linux/ffmpeg -version | head -n 1

      - name: Rebuild native addons
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build Electron app (deb + AppImage)
        run: npx electron-builder --linux --publish never

      - name: Verify packaged artifacts
        shell: bash
        run: |
          set -euxo pipefail
          found=0
          while IFS= read -r archive; do
            case "$archive" in
              *.AppImage)
                mkdir -p appimage-check
                (cd appimage-check && "$(pwd)/../$archive" --appimage-extract >/dev/null)
                test -s appimage-check/squashfs-root/resources/carminium_audio.so
                # ffmpeg is unpacked from asar into app.asar.unpacked
                find appimage-check/squashfs-root -name 'ffmpeg' -type f -executable | head -n 1 | grep -q .
                found=1
                ;;
              *.deb)
                # pipe to a temp file first; grep closing the pipe early under
                # `pipefail` would otherwise make tar exit with SIGPIPE.
                dpkg-deb -c "$archive" > /tmp/deb-contents.txt
                grep -Eq 'resources/carminium_audio\.so$' /tmp/deb-contents.txt
                grep -Eq 'ffmpeg$' /tmp/deb-contents.txt
                rm -f /tmp/deb-contents.txt
                found=1
                ;;
            esac
          done < <(find dist-electron -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' \))
          test "$found" -eq 1

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist-electron/*.deb
            dist-electron/*.AppImage
          retention-days: 7

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: windows-*-artifacts
          merge-multiple: true
          path: artifacts

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts

      - name: Fetch random hitokoto
        id: hitokoto
        shell: bash
        run: |
          HITOKOTO=$(curl -fsSL --retry 3 --connect-timeout 5 --max-time 15 \
            'https://v1.hitokoto.cn/' | jq -r '.hitokoto // empty' || true)
          if [ -z "$HITOKOTO" ]; then
            HITOKOTO='感谢每一位参与和支持 Carminium 的人。'
          fi
          {
            echo 'text<<HITOKOTO_EOF'
            echo "$HITOKOTO"
            echo 'HITOKOTO_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Carminium ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          body: |
            > ${{ steps.hitokoto.outputs.text }}

            ## 反馈与贡献

            - 如需反馈问题或提出功能建议，请前往 [Issues](../../issues) 提交，并尽量附上复现步骤、系统版本和相关日志。
            - 如需提交 PR，请先阅读项目贡献说明，在独立分支完成修改并提交测试结果，然后创建 Pull Request。
            - 发布包问题请注明使用的版本号和平台架构（Windows x64、Windows ARM64 或 Linux x64）。

          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
