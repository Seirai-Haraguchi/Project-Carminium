name: Nightly Build & Prerelease

on:
  schedule:
    # 每天 UTC 16:00 运行（北京时间次日 00:00）
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # 1. 更新版本号日期并提交
  # ─────────────────────────────────────────────
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.update.outputs.version }}
      date: ${{ steps.update.outputs.date }}
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update version date
        id: update
        run: |
          output=$(node scripts/update-nightly-version.js)
          echo "$output"
          VERSION=$(echo "$output" | grep '^NIGHTLY_VERSION=' | cut -d= -f2)
          DATE=$(echo "$output" | grep '^NIGHTLY_DATE=' | cut -d= -f2)
          CHANGED=$(echo "$output" | grep '^NIGHTLY_CHANGED=' | cut -d= -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

      - name: Commit & push
        if: steps.update.outputs.changed == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json package.json
          git commit -m "chore(nightly): update version date to ${{ steps.update.outputs.version }}"
          git push

  # ─────────────────────────────────────────────
  # 2. Windows 构建
  # ─────────────────────────────────────────────
  build-windows:
    needs: update-version
    # 定时触发：仅版本变更时构建；手动触发：始终构建
    if: needs.update-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            zig-target: x86_64-windows-gnu
          - arch: arm64
            zig-target: aarch64-windows-gnu
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --include=optional --cpu=${{ matrix.arch }}

      - name: Update version locally
        run: node scripts/update-nightly-version.js

      - name: Verify synchronized version
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('version.json', 'utf8')).version;
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const match = raw.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)(?:-(.+))?$/);
          if (!match) throw new Error(`Invalid version.json version: ${raw}`);
          const expected = `${match[1]}.${match[2]}.${match[3]}-${match[4]}${match[5] ? `.${match[5]}` : ''}`;
          if (pkg !== expected) throw new Error(`Version mismatch: package.json=${pkg}, expected=${expected}`);
          console.log(`Version synchronized: ${raw} -> ${pkg}`);
          NODE

      - name: Download ffmpeg/ffprobe (Windows)
        shell: pwsh
        run: |
          Write-Host "Fetching BtbN/FFmpeg-Builds latest release..."
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest" -Headers @{ "User-Agent" = "CI" }
          $pattern = if ('${{ matrix.arch }}' -eq 'arm64') { 'winarm64-gpl\.zip$' } else { 'win64-gpl\.zip$' }
          $asset = $release.assets | Where-Object { $_.name -match $pattern -and $_.name -notmatch "shared" } | Select-Object -First 1
          if (-not $asset) { throw "No FFmpeg asset found for ${{ matrix.arch }}" }
          Write-Host "Downloading $($asset.name) ($([math]::Round($asset.size / 1MB, 1)) MB)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-temp -Force
          $binDir = Get-ChildItem ffmpeg-temp -Directory | Select-Object -First 1
          Copy-Item "$($binDir.FullName)\bin\ffmpeg.exe" electron\bin\win32\ffmpeg.exe -Force
          Copy-Item "$($binDir.FullName)\bin\ffprobe.exe" electron\bin\win32\ffprobe.exe -Force
          Remove-Item -Recurse ffmpeg-temp, ffmpeg.zip -Force
          if ('${{ matrix.arch }}' -eq 'x64') {
            Write-Host "ffmpeg installed:"; electron\bin\win32\ffprobe.exe -version | Select-Object -First 1
          } else {
            Write-Host "ffmpeg installed for ARM64 (not executed on the x64 runner)."
          }

      - name: Build native library (Zig)
        working-directory: native
        run: |
          zig build copy copy-legacy -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig-target }}

      - name: Rebuild native addons
        run: npx @electron/rebuild -f -w better-sqlite3 --arch ${{ matrix.arch }}

      - name: Build Electron app (portable)
        run: npx electron-builder --win portable --${{ matrix.arch }} --publish never

      - name: Rename artifact with architecture
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $source = Get-ChildItem dist-electron\*.exe | Select-Object -First 1
          $destination = "dist-electron\Carminium-$version-windows-${{ matrix.arch }}.exe"
          Move-Item $source.FullName $destination -Force
          Write-Host "Created $destination"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-artifacts
          path: dist-electron/*.exe
          retention-days: 7

  # ─────────────────────────────────────────────
  # 3. Linux 构建
  # ─────────────────────────────────────────────
  build-linux:
    needs: update-version
    # 定时触发：仅版本变更时构建；手动触发：始终构建
    if: needs.update-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libfuse2

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --include=optional

      - name: Update version locally
        run: node scripts/update-nightly-version.js

      - name: Verify synchronized version (Linux)
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('version.json', 'utf8')).version;
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const match = raw.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)(?:-(.+))?$/);
          if (!match) throw new Error(`Invalid version.json version: ${raw}`);
          const expected = `${match[1]}.${match[2]}.${match[3]}-${match[4]}${match[5] ? `.${match[5]}` : ''}`;
          if (pkg !== expected) throw new Error(`Version mismatch: package.json=${pkg}, expected=${expected}`);
          console.log(`Version synchronized: ${raw} -> ${pkg}`);
          NODE

      - name: Download ffmpeg/ffprobe (Linux)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Fetching BtbN/FFmpeg-Builds latest release..."
          API_URL="https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest"
          RELEASE_JSON=$(curl --fail-with-body --retry 3 --retry-delay 2 -sSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: Carminium-nightly" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "$API_URL")
          FFMPEG_URL=$(printf '%s' "$RELEASE_JSON" \
            | jq -r '[.assets // [] | .[] | select(.name | endswith("linux64-gpl.tar.xz"))][0].browser_download_url // empty')
          if [ -z "$FFMPEG_URL" ]; then
            echo "No linux64-gpl.tar.xz asset found in the latest BtbN release." >&2
            printf '%s' "$RELEASE_JSON" | jq -r '.message // "API response did not contain a matching asset"' >&2
            exit 1
          fi
          echo "Downloading $FFMPEG_URL..."
          curl --fail-with-body --retry 3 --retry-delay 2 -L -o ffmpeg.tar.xz "$FFMPEG_URL"
          tar -tf ffmpeg.tar.xz > ffmpeg-contents.txt
          DIR=$(sed -n '1s#/.*##p' ffmpeg-contents.txt)
          if [ -z "$DIR" ]; then
            echo "Unable to determine FFmpeg archive directory." >&2
            head -n 10 ffmpeg-contents.txt >&2
            exit 1
          fi
          tar xf ffmpeg.tar.xz
          if [ ! -d "$DIR" ] || [ ! -x "$DIR/bin/ffmpeg" ] || [ ! -x "$DIR/bin/ffprobe" ]; then
            echo "FFmpeg archive has an unexpected layout: $DIR" >&2
            find "$DIR" -maxdepth 2 -type f 2>/dev/null | head -n 20 >&2 || true
            exit 1
          fi
          cp "$DIR/bin/ffmpeg"  electron/bin/linux/ffmpeg
          cp "$DIR/bin/ffprobe" electron/bin/linux/ffprobe
          rm -rf "$DIR" ffmpeg.tar.xz ffmpeg-contents.txt
          electron/bin/linux/ffprobe -version > ffprobe-version.txt 2>&1
          echo "ffmpeg installed:"; head -n 1 ffprobe-version.txt
          rm -f ffprobe-version.txt

      - name: Build native library (Zig)
        working-directory: native
        run: zig build copy copy-legacy -Doptimize=ReleaseFast

      - name: Verify Linux native audio library
        shell: bash
        run: |
          set -euxo pipefail
          test -s electron/bin/linux/carminium_audio.so
          file electron/bin/linux/carminium_audio.so
          ldd electron/bin/linux/carminium_audio.so

      - name: Rebuild native addons
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build Electron app (deb + AppImage)
        run: npx electron-builder --linux --publish never

      - name: Verify packaged native audio library
        shell: bash
        run: |
          set -euxo pipefail
          found=0
          while IFS= read -r archive; do
            case "$archive" in
              *.AppImage)
                mkdir -p appimage-check
                (cd appimage-check && "$(pwd)/../$archive" --appimage-extract >/dev/null)
                test -s appimage-check/squashfs-root/resources/carminium_audio.so
                found=1
                ;;
              *.deb)
                dpkg-deb -c "$archive" | grep -Eq '/resources/carminium_audio\.so$'
                found=1
                ;;
            esac
          done < <(find dist-electron -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' \))
          test "$found" -eq 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist-electron/*.deb
            dist-electron/*.AppImage
          retention-days: 7

  # ─────────────────────────────────────────────
  # 4. 创建 GitHub Prerelease
  # ─────────────────────────────────────────────
  release:
    needs: [update-version, build-windows, build-linux]
    if: needs.update-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: windows-*-artifacts
          merge-multiple: true
          path: artifacts

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create or update prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ needs.update-version.outputs.date }}
          name: Nightly ${{ needs.update-version.outputs.version }}
          prerelease: true
          make_latest: 'false'
          allowUpdates: true
          body: |
            ## Nightly Build

            **版本:** `${{ needs.update-version.outputs.version }}`
            **构建日期:** `${{ needs.update-version.outputs.date }}`

            > ⚠️ 这是自动构建的 nightly 版本，可能不稳定。

            ### 下载
            - **Windows:** `.exe` (portable) — 免安装便携版
            - **Linux:** `.deb` — Debian/Ubuntu 安装包
            - **Linux:** `.AppImage` — 免安装直接运行
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old nightly releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 删除 7 天前的 nightly releases
          CUTOFF=$(date -d "7 days ago" +%Y%m%d)
          echo "Cleaning up nightly releases older than ${CUTOFF}"
          gh release list --limit 100 | grep 'Nightly' | while IFS= read -r line; do
            TAG=$(echo "$line" | awk '{print $1}')
            TAG_DATE=$(echo "$TAG" | grep -oP '\d{8}')
            if [ -n "$TAG_DATE" ] && [ "$TAG_DATE" -lt "$CUTOFF" ]; then
              echo "Deleting old nightly release: ${TAG}"
              gh release delete "$TAG" --yes --cleanup-tag
            fi
          done
