name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        type: string
      prerelease:
        description: 'Mark this release as a prerelease'
        required: true
        default: false
        type: boolean
      draft:
        description: 'Create the release as a draft'
        required: true
        default: false
        type: boolean
      assets_only:
        description: 'Only replace assets of an existing release (keep its name and changelog untouched)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            zig-target: ''
          - arch: arm64
            runner: windows-11-arm
            zig-target: -Dtarget=aarch64-windows-gnu
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig (native)
        if: matrix.arch != 'arm64'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      # zig-aarch64-windows-0.16.0 is broken: any `zig build` on a native
      # ARM64 host fails immediately with
      # "Invalid cast (Producer: 'zig 0.16.0' Reader: 'LLVM 21.1.0')"
      # while compiling the build runner, regardless of -Dtarget. On the
      # ARM64 runner we therefore run the x86_64 compiler under Windows 11
      # x64 emulation and cross-compile the library with
      # -Dtarget=aarch64-windows-gnu (the configuration that produced green
      # ARM64 builds before the native-runner migration).
      - name: Setup Zig (x86_64 under x64 emulation)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TOOL_CACHE\zig\0.16.0\x86_64"
          if (-not (Test-Path "$dest\zig.exe")) {
            $zip = "$env:RUNNER_TEMP\zig-x86_64-windows-0.16.0.zip"
            Invoke-WebRequest -Uri "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip" -OutFile $zip
            $tmp = "$env:RUNNER_TEMP\zig-x86_64-extract"
            Expand-Archive -Path $zip -DestinationPath $tmp -Force
            $inner = (Get-ChildItem $tmp -Directory | Select-Object -First 1).FullName
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Move-Item "$inner\*" $dest -Force
          }
          Add-Content $env:GITHUB_PATH "$dest"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci --include=optional --prefer-offline --no-audit --no-fund

      - name: Sync version
        run: node scripts/sync-version.js

      - name: Download ffmpeg/ffprobe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            "User-Agent" = "Carminium-release"
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Accept" = "application/vnd.github+json"
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest" -Headers $headers
          $pattern = if ('${{ matrix.arch }}' -eq 'arm64') { 'winarm64-gpl\.zip$' } else { 'win64-gpl\.zip$' }
          $asset = $release.assets | Where-Object { $_.name -match $pattern -and $_.name -notmatch "shared" } | Select-Object -First 1
          if (-not $asset) { throw "No FFmpeg asset found for ${{ matrix.arch }}" }
          Write-Host "Downloading $($asset.name) ($([math]::Round($asset.size / 1MB, 1)) MB)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-temp -Force
          $binDir = Get-ChildItem ffmpeg-temp -Directory | Select-Object -First 1
          Copy-Item "$($binDir.FullName)\bin\ffmpeg.exe" electron\bin\win32\ffmpeg.exe -Force
          Copy-Item "$($binDir.FullName)\bin\ffprobe.exe" electron\bin\win32\ffprobe.exe -Force
          Remove-Item -Recurse ffmpeg-temp, ffmpeg.zip -Force
          Write-Host "ffmpeg installed:"; electron\bin\win32\ffprobe.exe -version | Select-Object -First 1

      - name: Build native library (Zig)
        working-directory: native
        # Pin the CPU baseline: with the default `native` CPU model the DLL is
        # compiled for whatever CPU the hosted runner happens to have, and can
        # then die with 0xc000001d (illegal instruction) on user machines as
        # soon as audio playback touches the native renderer.
        run: zig version && zig build copy copy-legacy -Doptimize=ReleaseFast -Dcpu=baseline ${{ matrix.zig-target }}

      # Guard: prove the DLL is pure aarch64 machine code (PE Machine = 0xAA64),
      # regardless of the compiler binary's own architecture.
      - name: Verify ARM64 DLL (PE machine type)
        if: matrix.arch == 'arm64'
        working-directory: native
        shell: pwsh
        run: |
          $dll = Get-Item "..\electron\bin\win32\carminium_audio.dll"
          $b = [IO.File]::ReadAllBytes($dll.FullName)
          $peOff = [BitConverter]::ToInt32($b, 0x3C)
          $machine = [BitConverter]::ToUInt16($b, $peOff + 4)
          if ($machine -ne 0xAA64) {
            throw "$($dll.Name) is NOT pure ARM64 (PE Machine=0x$($machine.ToString('X4')), expected 0xAA64)"
          }
          Write-Host "$($dll.Name): PE Machine=0xAA64 (ARM64) - pure aarch64 native code confirmed"

      - name: Rebuild native addons
        shell: pwsh
        run: |
          npx @electron/rebuild -f -w better-sqlite3
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to rebuild better-sqlite3"
          }

      - name: Verify pre-build artifacts and architectures (Windows)
        shell: pwsh
        run: |
          # --- existence checks ---
          if (-not (Test-Path electron\bin\win32\carminium_audio.dll) -or (Get-Item electron\bin\win32\carminium_audio.dll).Length -eq 0) {
            throw "carminium_audio.dll is missing or empty"
          }
          if (-not (Test-Path electron\bin\win32\ffmpeg.exe) -or (Get-Item electron\bin\win32\ffmpeg.exe).Length -eq 0) {
            throw "ffmpeg.exe is missing or empty"
          }

          # --- PE machine type verification ---
          function Get-PEMachine {
            param([string]$Path)
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            if ($bytes.Length -lt 64) { return "TOO SMALL" }
            $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
            switch ($machine) {
              0x8664 { return 'x64' }
              0xAA64 { return 'ARM64' }
              0x014C { return 'x86' }
              default { return "Unknown (0x$($machine.ToString('X4')))" }
            }
          }
          $expectedMachine = if ('${{ matrix.arch }}' -eq 'arm64') { 'ARM64' } else { 'x64' }

          # carminium_audio.dll
          $actual = Get-PEMachine electron\bin\win32\carminium_audio.dll
          Write-Host "carminium_audio.dll: $actual (expected: $expectedMachine)"
          if ($actual -ne $expectedMachine) { throw "carminium_audio.dll architecture mismatch: $actual != $expectedMachine" }

          # ffmpeg.exe
          $actual = Get-PEMachine electron\bin\win32\ffmpeg.exe
          Write-Host "ffmpeg.exe: $actual (expected: $expectedMachine)"
          if ($actual -ne $expectedMachine) { throw "ffmpeg.exe architecture mismatch: $actual != $expectedMachine" }

          # better-sqlite3 native addon (prebuilds or build/Release)
          $prebuildFile = "node_modules\better-sqlite3\prebuilds\win32-${{ matrix.arch }}.node"
          $buildFile = "node_modules\better-sqlite3\build\Release\better_sqlite3.node"
          $nodeFile = if (Test-Path $prebuildFile) { $prebuildFile } elseif (Test-Path $buildFile) { $buildFile } else { $null }
          if ($nodeFile) {
            $actual = Get-PEMachine $nodeFile
            Write-Host "better_sqlite3.node ($nodeFile): $actual (expected: $expectedMachine)"
            if ($actual -ne $expectedMachine) { throw "better_sqlite3.node architecture mismatch: $actual != $expectedMachine" }
          } else {
            throw "better_sqlite3.node not found at $prebuildFile or $buildFile"
          }

          # koffi optional dependency
          $koffiDir = "node_modules\@koromix\koffi-win32-${{ matrix.arch }}"
          if (-not (Test-Path $koffiDir)) { throw "koffi ${{ matrix.arch }} dependency not found: $koffiDir" }
          Write-Host "koffi ${{ matrix.arch }} dependency: OK"

          # sharp optional dependency
          $sharpDir = "node_modules\@img\sharp-win32-${{ matrix.arch }}"
          if (-not (Test-Path $sharpDir)) { throw "sharp ${{ matrix.arch }} dependency not found: $sharpDir" }
          Write-Host "sharp ${{ matrix.arch }} dependency: OK"

          Write-Host "Pre-build artifacts and architectures verified."
          Get-Item electron\bin\win32\carminium_audio.dll, electron\bin\win32\ffmpeg.exe | Format-Table Name, Length

      - name: Clean up unnecessary build artifacts
        shell: pwsh
        run: |
          if (Test-Path node_modules\koffi\build) {
            Remove-Item -Recurse -Force node_modules\koffi\build
            Write-Host "Removed koffi CMake build artifacts"
          }

      - name: Build Electron app (portable + nsis + dir)
        shell: pwsh
        run: |
          $maxRetries = 3
          $retryCount = 0
          do {
            $retryCount++
            Write-Host "Build attempt $retryCount of $maxRetries"
            # Keep `dir` in the target list so win-unpacked / win-arm64-unpacked
            # stay on disk for the FFmpeg and playback verification steps.
            npx electron-builder --win portable nsis dir --${{ matrix.arch }} --publish never
            if ($LASTEXITCODE -eq 0) { break }
            if ($retryCount -lt $maxRetries) {
              Write-Host "Build failed, retrying in 15 seconds..."
              Start-Sleep -Seconds 15
            }
          } while ($retryCount -lt $maxRetries)
          if ($LASTEXITCODE -ne 0) { throw "Build failed after $maxRetries attempts" }

      - name: Rename artifacts with architecture
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $portable = Get-ChildItem dist-electron\*.exe | Where-Object { $_.Name -match 'portable' } | Select-Object -First 1
          $setup = Get-ChildItem dist-electron\*.exe | Where-Object { $_.Name -match 'Setup' } | Select-Object -First 1
          if (-not $portable) { throw "portable .exe not found" }
          if (-not $setup) { throw "NSIS setup .exe not found" }
          $portableDest = "dist-electron\Carminium-$version-windows-${{ matrix.arch }}-portable.exe"
          $setupDest = "dist-electron\Carminium-$version-windows-${{ matrix.arch }}-setup.exe"
          Move-Item $portable.FullName $portableDest -Force
          Move-Item $setup.FullName $setupDest -Force
          Write-Host "Created $portableDest"
          Write-Host "Created $setupDest"

      - name: Verify packaged FFmpeg (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ matrix.arch }}'
          $outDir = if ($arch -eq 'arm64') { 'win-arm64-unpacked' } else { 'win-unpacked' }
          $binDir = "dist-electron\$outDir\resources\app.asar.unpacked\electron\bin\win32"
          $ffmpeg  = Join-Path $binDir 'ffmpeg.exe'
          $ffprobe = Join-Path $binDir 'ffprobe.exe'

          # 1. The binaries MUST live outside app.asar: spawn() cannot execute
          #    a file that only exists inside the archive.
          foreach ($f in @($ffmpeg, $ffprobe)) {
            if (-not (Test-Path $f)) { throw "Bundled FFmpeg binary missing outside asar: $f" }
            $size = (Get-Item $f).Length
            if ($size -lt 1MB) { throw "Bundled FFmpeg binary looks truncated ($size bytes): $f" }
            Write-Host "OK: $f ($([math]::Round($size / 1MB, 1)) MB)"
          }

          # 2. They must actually run AND decode. Startup-only smoke tests pass
          #    even when the bundled FFmpeg build is broken, because playback is
          #    the first thing that spawns it.
          $ffmpegVersion = & $ffmpeg -version 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'Bundled ffmpeg.exe failed to run' }
          Write-Host ($ffmpegVersion | Select-Object -First 1)
          $ffprobeVersion = & $ffprobe -version 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'Bundled ffprobe.exe failed to run' }
          Write-Host ($ffprobeVersion | Select-Object -First 1)

          $pcm = Join-Path $env:RUNNER_TEMP 'carminium-ffmpeg-smoke.pcm'
          Remove-Item $pcm -Force -ErrorAction SilentlyContinue
          & $ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=0.2' `
            -f f32le -ar 44100 -ac 2 -y $pcm
          if ($LASTEXITCODE -ne 0) { throw 'Bundled ffmpeg.exe failed the PCM decode smoke test' }
          $pcmLen = (Get-Item $pcm).Length
          if ($pcmLen -lt 10000) { throw "Bundled ffmpeg.exe produced no PCM audio ($pcmLen bytes)" }
          Write-Host "Decode smoke OK: $pcmLen bytes of f32le PCM"

          # 3. The final portable exe must contain the very same unpacked
          #    binaries. GitHub-hosted Windows runners ship 7-Zip; if missing,
          #    we still validated the exact tree the portable exe is built from.
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          # Only the portable exe carries the app-*.7z payload; the NSIS
          # setup exe is a different container and must not be inspected here.
          $exe = (Get-ChildItem dist-electron\*portable*.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw 'portable exe not found for payload check' }
          if (-not (Test-Path $sevenZip)) {
            Write-Host '::warning::7-Zip not found on runner; skipping portable payload check'
            return
          }
          $tmp = Join-Path $env:RUNNER_TEMP 'portable-ffmpeg-check'
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          & $sevenZip e $exe "-ir!*app-*.7z" "-o$tmp" -y | Out-Null
          $inner = Get-ChildItem $tmp -Filter 'app-*.7z' | Select-Object -First 1
          if (-not $inner) { throw "portable exe has no app-*.7z payload: $exe" }
          $listing = & $sevenZip l $inner.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Failed to list the portable payload' }
          foreach ($name in @('ffmpeg.exe', 'ffprobe.exe')) {
            $pattern = "app\.asar\.unpacked\\electron\\bin\\win32\\$([regex]::Escape($name))"
            if (-not ($listing -match $pattern)) {
              throw "$name is NOT present in the portable exe payload ($($inner.Name))"
            }
            Write-Host "OK: $name present in $($inner.Name)"
          }
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          Remove-Item $pcm -Force -ErrorAction SilentlyContinue

      # A startup-only smoke test passes even when pressing play does nothing.
      # Drive the real renderer through CDP and assert playback actually starts.
      - name: Playback smoke test (packaged)
        if: ${{ matrix.arch == 'x64' }}
        shell: pwsh
        env:
          CDP_PORT: '9333'
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "dist-electron\win-unpacked\Project Carminium.exe"
          if (-not (Test-Path $exe)) { throw "win-unpacked exe not found" }
          $wav = Join-Path $env:RUNNER_TEMP 'carminium-playback-smoke.wav'
          & "electron\bin\win32\ffmpeg.exe" -hide_banner -loglevel error `
            -f lavfi -i 'sine=frequency=440:duration=30' -ar 44100 -ac 2 -y $wav
          if (-not (Test-Path $wav)) { throw "failed to generate smoke audio" }
          $env:ELECTRON_ENABLE_LOGGING = '1'
          $out = "$env:RUNNER_TEMP\pb-stdout.txt"
          $err = "$env:RUNNER_TEMP\pb-stderr.txt"
          $proc = Start-Process -FilePath $exe -ArgumentList '--remote-debugging-port=9333' `
            -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            node scripts/ci-playback-smoke.js $wav
          } catch {
            Write-Host "===== packaged playback stderr (tail) ====="
            if (Test-Path $err) { Get-Content $err -Tail 40 }
            Write-Host "===== packaged playback stdout (tail) ====="
            if (Test-Path $out) { Get-Content $out -Tail 40 }
            throw
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-Process 'Project Carminium' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test (dev mode)
        shell: pwsh
        run: |
          # Run the app directly with the dev Electron binary before testing
          # the packaged portable exe. This exercises the same startup path
          # (native modules, carminium_audio.dll) without asar packaging, and
          # its captured stderr pinpoints startup failures.
          $electron = "node_modules\electron\dist\electron.exe"
          if (-not (Test-Path $electron)) { Write-Host "electron.exe not found, skipping dev smoke"; exit 0 }
          $out = "$env:RUNNER_TEMP\dev-stdout.txt"
          $err = "$env:RUNNER_TEMP\dev-stderr.txt"
          $env:ELECTRON_ENABLE_LOGGING = '1'
          Write-Host "Dev smoke: $electron ."
          $proc = Start-Process -FilePath $electron -ArgumentList "." -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          $exited = $proc.WaitForExit(15000)
          if ($exited) {
            Write-Host "::error::Dev-mode electron exited with code $($proc.ExitCode)"
            foreach ($f in @($err, $out)) {
              if (Test-Path $f) {
                $tag = if ($f -eq $err) { 'DEV-ERR' } else { 'DEV-OUT' }
                Get-Content $f -Tail 10 | Where-Object { $_.Trim() } | Select-Object -First 8 | ForEach-Object {
                  $line = ($_ -replace '\s+', ' ').Trim()
                  if ($line.Length -gt 240) { $line = $line.Substring(0, 240) }
                  Write-Host "::error::$tag`: $line"
                  Write-Host $line
                }
              }
            }
            $bootLog = Join-Path $env:APPDATA 'Project Carminium\logs\boot.log'
            if (Test-Path $bootLog) {
              Write-Host "===== boot.log (tail) ====="
              Get-Content $bootLog -Tail 30 | ForEach-Object { Write-Host $_ }
              Get-Content $bootLog | Where-Object { $_ -match 'uncaughtException' } | Select-Object -First 3 | ForEach-Object {
                $line = ($_ -replace '\s+', ' ').Trim()
                if ($line.Length -gt 240) { $line = $line.Substring(0, 240) }
                Write-Host "::error::BOOT: $line"
              }
            }
            throw "Dev smoke test failed: exit code $($proc.ExitCode)"
          }
          Write-Host "Dev-mode electron still running after 15s — dev smoke passed."
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          # Electron may leave child processes (gpu, renderer); clean up by name
          Get-Process electron -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Smoke test (win-unpacked)
        shell: pwsh
        run: |
          # Run the unpacked packaged app (the portable exe is built from this
          # exact tree). Unlike the NSIS portable wrapper it forwards the main
          # process stdout/stderr, so startup failures show their real error.
          $exe = "dist-electron\win-unpacked\Project Carminium.exe"
          if (-not (Test-Path $exe)) { Write-Host "win-unpacked exe not found, skipping"; exit 0 }
          $out = "$env:RUNNER_TEMP\unp-stdout.txt"
          $err = "$env:RUNNER_TEMP\unp-stderr.txt"
          $env:ELECTRON_ENABLE_LOGGING = '1'
          Write-Host "Unpacked smoke: $exe"
          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          $exited = $proc.WaitForExit(15000)
          if ($exited) {
            Write-Host "::error::win-unpacked app exited with code $($proc.ExitCode)"
            foreach ($f in @($err, $out)) {
              if (Test-Path $f) {
                $tag = if ($f -eq $err) { 'UNP-ERR' } else { 'UNP-OUT' }
                Write-Host "===== $tag full ====="
                Get-Content $f | ForEach-Object { Write-Host $_ }
                Get-Content $f | Where-Object { $_.Trim() } | Select-Object -First 6 | ForEach-Object {
                  $line = ($_ -replace '\s+', ' ').Trim()
                  if ($line.Length -gt 240) { $line = $line.Substring(0, 240) }
                  Write-Host "::error::$tag`: $line"
                }
              }
            }
            $bootLog = Join-Path $env:APPDATA 'Project Carminium\logs\boot.log'
            if (Test-Path $bootLog) {
              Write-Host "===== boot.log (tail) ====="
              Get-Content $bootLog -Tail 30 | ForEach-Object { Write-Host $_ }
              Get-Content $bootLog | Where-Object { $_ -match 'uncaughtException' } | Select-Object -First 3 | ForEach-Object {
                $line = ($_ -replace '\s+', ' ').Trim()
                if ($line.Length -gt 240) { $line = $line.Substring(0, 240) }
                Write-Host "::error::BOOT: $line"
              }
            }
            throw "win-unpacked smoke failed: exit code $($proc.ExitCode)"
          }
          Write-Host "win-unpacked app still running after 15s — unpacked smoke passed."
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Process "Project Carminium" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Smoke test (native runner)
        shell: pwsh
        run: |
          # Start the portable exe, wait, then kill it. On a native runner
          # (x64 on windows-latest, ARM64 on windows-11-arm) a successful
          # start means the Electron binary and all native modules loaded.
          # stdout/stderr are captured so startup failures (e.g. a native
          # module that fails to load) are visible in the job log.
          # Only the portable exe is a runnable app; the NSIS setup .exe is an
          # installer and must never be picked for the startup smoke test.
          $exe = (Get-ChildItem dist-electron\*portable*.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw "portable exe not found for smoke test" }
          Write-Host "Smoke testing: $exe"
          $out = "$env:RUNNER_TEMP\smoke-stdout.txt"
          $err = "$env:RUNNER_TEMP\smoke-stderr.txt"
          $env:ELECTRON_ENABLE_LOGGING = '1'
          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          $exited = $proc.WaitForExit(20000)
          if ($exited) {
            Write-Host "::error::Process exited with code $($proc.ExitCode)"
            foreach ($f in @($out, $err)) {
              if (Test-Path $f) {
                Write-Host "===== $(Split-Path $f -Leaf) (tail) ====="
                Get-Content $f -Tail 120 | ForEach-Object { Write-Host $_ }
              }
            }
            # Mirror the last stderr/stdout lines into annotations so the
            # actual startup error is visible without log download rights.
            $annCount = 0
            foreach ($f in @($err, $out)) {
              if (-not (Test-Path $f)) { continue }
              $tag = if ($f -eq $err) { 'SMOKE-ERR' } else { 'SMOKE-OUT' }
              Get-Content $f -Tail 15 | Where-Object { $_.Trim() } | Select-Object -Last 6 | ForEach-Object {
                if ($annCount -ge 10) { return }
                $annCount++
                $line = ($_ -replace '\s+', ' ').Trim()
                if ($line.Length -gt 240) { $line = $line.Substring(0, 240) }
                Write-Host "::error::$tag`: $line"
              }
            }
            $ud = Join-Path $env:APPDATA 'Project Carminium'
            if (Test-Path $ud) {
              Write-Host "===== userData files ====="
              Get-ChildItem $ud -Recurse -File -ErrorAction SilentlyContinue |
                Select-Object -First 40 FullName, Length | Format-Table -AutoSize | Out-String | Write-Host
            }
            $bootLog = Join-Path $env:APPDATA 'Project Carminium\logs\boot.log'
            if (Test-Path $bootLog) {
              Write-Host "===== boot.log (tail) ====="
              Get-Content $bootLog -Tail 30 | ForEach-Object { Write-Host $_ }
              Get-Content $bootLog | Where-Object { $_ -match 'uncaughtException' } | Select-Object -First 3 | ForEach-Object {
                $line = ($_ -replace '\s+', ' ').Trim()
                if ($line.Length -gt 240) { $line = $line.Substring(0, 240) }
                Write-Host "::error::BOOT: $line"
              }
            } else {
              Write-Host "::error::boot.log not found — main.js never reached first line (loader/asar issue?)"
            }
            throw "Smoke test failed: process exited with code $($proc.ExitCode)"
          }
          Write-Host "Process is still running after 20s — smoke test passed."
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-artifacts
          path: dist-electron/*.exe
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          # GitHub-hosted Ubuntu images may contain Microsoft/Azure sources
          # that intermittently return 403 or are malformed. They are unrelated
          # to this build; disable them for this ephemeral runner before APT.
          # Handle both legacy .list and deb822 .sources formats.
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list \
                    /etc/apt/sources.list.d/azure-cli.sources \
                    /etc/apt/sources.list.d/msprod.list \
                    /etc/apt/sources.list.d/msprod.sources \
                    /etc/apt/sources.list.d/microsoft-prod.list \
                    /etc/apt/sources.list.d/microsoft-prod.sources || true
          sudo sed -i '/packages.microsoft.com/d' /etc/apt/sources.list || true
          sudo sed -i '/packages.microsoft.com/d' /etc/apt/sources.list.d/*.list 2>/dev/null || true

          sudo apt-get update
          # build-essential / g++ / make / python3: Zig & node-gyp / better-sqlite3
          # libsqlite3-dev: better-sqlite3 native binding
          # libasound2-dev / libpulse-dev / libfuse2: audio + AppImage runtime
          # libgtk-3-dev / libnotify-dev / libappindicator3-dev / libxtst-dev / libxss-dev: electron-builder linux deps
          # jq / ca-certificates / wget: ffmpeg release JSON parsing & download
          sudo apt-get install -y \
            build-essential \
            python3 \
            python3-pip \
            python3-dev \
            make \
            g++ \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libfuse2 \
            libssl-dev \
            libsqlite3-dev \
            libgtk-3-dev \
            libnotify-dev \
            libappindicator3-dev \
            libxtst-dev \
            libxss-dev \
            jq \
            ca-certificates \
            wget

      - name: Setup Zig (Linux)
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Sync version
        run: node scripts/sync-version.js

      - name: Download ffmpeg/ffprobe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Fetching BtbN/FFmpeg-Builds latest release..."
          API_URL="https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest"
          RELEASE_JSON=$(curl --fail-with-body --retry 3 --retry-delay 2 -sSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: Carminium-release" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "$API_URL")
          FFMPEG_URL=$(printf '%s' "$RELEASE_JSON" \
            | jq -r '[.assets // [] | .[] | select(.name | endswith("linux64-gpl.tar.xz"))][0].browser_download_url // empty')
          if [ -z "$FFMPEG_URL" ]; then
            echo "No linux64-gpl.tar.xz asset found in the latest BtbN release." >&2
            printf '%s' "$RELEASE_JSON" | jq -r '.message // "API response did not contain a matching asset"' >&2
            exit 1
          fi
          echo "Downloading $FFMPEG_URL..."
          curl --fail-with-body --retry 3 --retry-delay 2 -L -o ffmpeg.tar.xz "$FFMPEG_URL"
          tar -tf ffmpeg.tar.xz > ffmpeg-contents.txt
          DIR=$(sed -n '1s#/.*##p' ffmpeg-contents.txt)
          if [ -z "$DIR" ]; then
            echo "Unable to determine FFmpeg archive directory." >&2
            head -n 10 ffmpeg-contents.txt >&2
            exit 1
          fi
          tar xf ffmpeg.tar.xz
          if [ ! -d "$DIR" ] || [ ! -x "$DIR/bin/ffmpeg" ] || [ ! -x "$DIR/bin/ffprobe" ]; then
            echo "FFmpeg archive has an unexpected layout: $DIR" >&2
            find "$DIR" -maxdepth 2 -type f 2>/dev/null | head -n 20 >&2 || true
            exit 1
          fi
          install -m 755 "$DIR/bin/ffmpeg"  electron/bin/linux/ffmpeg
          install -m 755 "$DIR/bin/ffprobe" electron/bin/linux/ffprobe
          rm -rf "$DIR" ffmpeg.tar.xz ffmpeg-contents.txt
          electron/bin/linux/ffprobe -version > ffprobe-version.txt 2>&1
          echo "ffmpeg installed:"; head -n 1 ffprobe-version.txt
          rm -f ffprobe-version.txt

      - name: Build native library (Zig)
        working-directory: native
        run: zig build copy copy-legacy -Doptimize=ReleaseFast -Dcpu=baseline

      - name: Verify pre-build artifacts (Linux)
        shell: bash
        run: |
          set -euxo pipefail
          test -s electron/bin/linux/carminium_audio.so
          test -x electron/bin/linux/ffmpeg
          test -x electron/bin/linux/ffprobe
          file electron/bin/linux/carminium_audio.so
          ldd electron/bin/linux/carminium_audio.so
          electron/bin/linux/ffmpeg -version | head -n 1

      - name: Rebuild native addons
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build Electron app (deb + AppImage)
        run: npx electron-builder --linux --publish never

      - name: Verify packaged artifacts
        shell: bash
        run: |
          set -euxo pipefail
          found=0
          while IFS= read -r archive; do
            case "$archive" in
              *.AppImage)
                mkdir -p appimage-check
                (cd appimage-check && "$(pwd)/../$archive" --appimage-extract >/dev/null)
                test -s appimage-check/squashfs-root/resources/carminium_audio.so
                # ffmpeg is unpacked from asar into app.asar.unpacked
                find appimage-check/squashfs-root -name 'ffmpeg' -type f -executable | head -n 1 | grep -q .
                found=1
                ;;
              *.deb)
                # pipe to a temp file first; grep closing the pipe early under
                # `pipefail` would otherwise make tar exit with SIGPIPE.
                dpkg-deb -c "$archive" > /tmp/deb-contents.txt
                grep -Eq 'resources/carminium_audio\.so$' /tmp/deb-contents.txt
                grep -Eq 'ffmpeg$' /tmp/deb-contents.txt
                rm -f /tmp/deb-contents.txt
                found=1
                ;;
            esac
          done < <(find dist-electron -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' \))
          test "$found" -eq 1

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist-electron/*.deb
            dist-electron/*.AppImage
          retention-days: 7

  # macOS: BtbN/FFmpeg-Builds has no macOS assets, so use the pinned
  # ffmpeg-static release. One runner per architecture keeps the Zig dylib and
  # the native addons on the same architecture as the packaged app.
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            expected-arch: x86_64
            ffmpeg-asset: ffmpeg-darwin-x64
            ffprobe-asset: ffprobe-darwin-x64
          - arch: arm64
            runner: macos-15
            expected-arch: arm64
            ffmpeg-asset: ffmpeg-darwin-arm64
            ffprobe-asset: ffprobe-darwin-arm64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      FFMPEG_VERSION: 'b6.1.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig (macOS)
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci --include=optional --prefer-offline --no-audit --no-fund

      - name: Sync version
        run: node scripts/sync-version.js

      - name: Download ffmpeg/ffprobe (macOS)
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/eugeneware/ffmpeg-static/releases/download/${FFMPEG_VERSION}"
          mkdir -p electron/bin/darwin
          for pair in "${{ matrix.ffmpeg-asset }}:ffmpeg" "${{ matrix.ffprobe-asset }}:ffprobe"; do
            asset="${pair%%:*}"
            dest="${pair##*:}"
            echo "Downloading ${asset} -> electron/bin/darwin/${dest}"
            curl -fsSL --retry 3 --retry-delay 2 "${BASE}/${asset}" -o "electron/bin/darwin/${dest}"
            chmod +x "electron/bin/darwin/${dest}"
            "electron/bin/darwin/${dest}" -version | head -n 1
            archs=$(lipo -archs "electron/bin/darwin/${dest}")
            echo "${dest}: ${archs}"
            [[ "${archs}" == *"${{ matrix.expected-arch }}"* ]] || { echo "::error::${dest} is not ${{ matrix.expected-arch }}"; exit 1; }
          done
          # A static build that starts but cannot decode is useless.
          electron/bin/darwin/ffmpeg -hide_banner -loglevel error \
            -f lavfi -i 'sine=frequency=440:duration=0.2' -f f32le -ar 44100 -ac 2 -y /tmp/carminium-ffmpeg-smoke.pcm
          test "$(stat -f%z /tmp/carminium-ffmpeg-smoke.pcm)" -ge 10000
          rm -f /tmp/carminium-ffmpeg-smoke.pcm

      - name: Build native library (Zig)
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          test -d "$SDK" || { echo "::error::macOS SDK not found"; exit 1; }
          echo "macOS SDK: $SDK"
          # Do not pass -Dtarget: each runner's native arch is the arch we want,
          # and Zig only auto-detects SDK paths for a native target. Passing the
          # SDK explicitly keeps the framework search list non-empty regardless.
          zig version && zig build copy copy-legacy -Doptimize=ReleaseFast -Dcpu=baseline -Dmacos-sdk="$SDK"

      - name: Verify native library (macOS)
        shell: bash
        run: |
          set -euxo pipefail
          test -s electron/bin/darwin/carminium_audio.dylib
          archs=$(lipo -archs electron/bin/darwin/carminium_audio.dylib)
          echo "dylib archs: ${archs}"
          [[ "${archs}" == *"${{ matrix.expected-arch }}"* ]]
          otool -L electron/bin/darwin/carminium_audio.dylib

      - name: Rebuild native addons
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build Electron app (dmg)
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Verify packaged app (macOS)
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls -1 dist-electron/*.dmg 2>/dev/null | head -n 1)
          test -n "${dmg}" || { echo "::error::no .dmg produced"; exit 1; }
          echo "Checking ${dmg}"
          mount=$(hdiutil attach -nobrowse -readonly "${dmg}" | awk -F'\t' '/\/Volumes\//{print $NF}' | tail -n 1)
          test -n "${mount}" || { echo "::error::failed to mount dmg"; exit 1; }
          trap 'hdiutil detach "${mount}" -quiet || true' EXIT
          app=$(ls -d "${mount}"/*.app 2>/dev/null | head -n 1)
          test -n "${app}" || { echo "::error::no .app inside dmg"; exit 1; }
          res="${app}/Contents/Resources"
          test -s "${res}/carminium_audio.dylib"
          test -s "${res}/app.asar.unpacked/electron/bin/darwin/carminium_audio.dylib"
          test -x "${res}/app.asar.unpacked/electron/bin/darwin/ffmpeg"
          test -x "${res}/app.asar.unpacked/electron/bin/darwin/ffprobe"
          "${res}/app.asar.unpacked/electron/bin/darwin/ffmpeg" -version | head -n 1
          appExe=$(ls -1 "${app}/Contents/MacOS" | head -n 1)
          appArchs=$(lipo -archs "${app}/Contents/MacOS/${appExe}")
          echo "app archs: ${appArchs}"
          [[ "${appArchs}" == *"${{ matrix.expected-arch }}"* ]]
          echo "macOS dmg verified."

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-artifacts
          path: dist-electron/*.dmg
          retention-days: 7

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: windows-*-artifacts
          merge-multiple: true
          path: artifacts

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*-artifacts
          merge-multiple: true
          path: artifacts

      - name: Fetch random hitokoto
        id: hitokoto
        if: ${{ !inputs.assets_only }}
        shell: bash
        run: |
          HITOKOTO=$(curl -fsSL --retry 3 --connect-timeout 5 --max-time 15 \
            'https://v1.hitokoto.cn/' | jq -r '.hitokoto // empty' || true)
          if [ -z "$HITOKOTO" ]; then
            HITOKOTO='感谢每一位参与和支持 Carminium 的人。'
          fi
          {
            echo 'text<<HITOKOTO_EOF'
            echo "$HITOKOTO"
            echo 'HITOKOTO_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ !inputs.assets_only }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Carminium ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          draft: ${{ inputs.draft }}
          # 允许对已存在的 release 重跑并替换同名资产
          # （例如修复打包产物后原版本号重新发布）。
          allowUpdates: true
          replace_artifacts: true
          generate_release_notes: true
          body: |
            > ${{ steps.hitokoto.outputs.text }}

            ## 反馈与贡献

            - 如需反馈问题或提出功能建议，请前往 [Issues](../../issues) 提交，并尽量附上复现步骤、系统版本和相关日志。
            - 如需提交 PR，请先阅读项目贡献说明，在独立分支完成修改并提交测试结果，然后创建 Pull Request。
            - 发布包问题请注明使用的版本号和平台架构（Windows x64 / ARM64、macOS x64 / ARM64 或 Linux x64）。

            ### 安装包
            - **Windows:** `-setup.exe`（NSIS 安装版）/ `-portable.exe`（免安装便携版）
            - **macOS:** `.dmg`（未签名，首次打开需在「系统设置 → 隐私与安全性」中允许）
            - **Linux:** `.deb` / `.AppImage`

          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Re-release path: swap only the attachments of an existing release so
      # the handwritten changelog / screenshots / title stay byte-for-byte as
      # they are. `gh release upload --clobber` never touches release metadata.
      - name: Replace release assets only (keep changelog)
        if: ${{ inputs.assets_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Replacing assets on ${{ inputs.tag }} without touching name/body/notes"
          ls -lh artifacts
          gh release upload "${{ inputs.tag }}" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
          echo "--- assets now on the release ---"
          gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name'
